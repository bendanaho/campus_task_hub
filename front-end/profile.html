<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>个人中心</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>

        <div class="container">
            <div class="logo">校园互助平台</div>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
