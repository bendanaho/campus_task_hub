<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>互助大厅 - 校园互助平台</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>
            <nav class="nav-links">

            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="section-title">互助大厅</h1>

            <div class="card">
                <div class="search-bar">
                    <div class="single-filter">
                        <select id="taskTypeFilter" class="form-control placeholder-select">
                            <option value="all" selected>全部</option>
                            <option value="payer">我能赚钱的（别人出钱）</option>
                            <option value="earner">我要花钱的（别人收钱）</option>
                            <option value="none">纯互助（不涉及金钱）</option>
                        </select>
                    </div>

                    <div class="filter-dropdown" id="filterDropdown">
                        <button type="button" class="filter-toggle" id="filterToggle">
                            选择任务分类
                        </button>

                        <div class="filter-menu" id="filterMenu">
                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="errand" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">跑腿代办（快递、外卖、代买）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="life-service" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">生活服务（搬运、打印、帮忙）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="skill-help" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">技能帮助（维修、设计、编程）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="study-help" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">学习互助（答疑、辅导、陪学）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="material-share" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">资料共享（课件、笔记、资料）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="item-trade" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">物品交易（二手、闲置、交换）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="teamwork" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">组队协作（搭子、组队、合作）</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="taskCategory" value="other" />
                                <span class="filter-icon">
                                    <span class="unchecked">○</span>
                                    <span class="checked">✓</span>
                                </span>
                                <span class="filter-text">其他（其他类型任务）</span>
                            </label>
                        </div>
                    </div>

                    <input
                        type="text"
                        id="taskKeyword"
                        class="form-control keyword-input"
                        placeholder="请输入任务关键词，如：快递、外卖、占座、辅导、设计"
                    />

                    <div class="single-filter">
                        <select id="sortSelect" class="form-control placeholder-select">
                            <option value="" selected>默认排序</option>
                            <option value="time_asc">发布时间：从早到晚</option>
                            <option value="time_desc">发布时间：从晚到早</option>
                            <option value="reward_asc">报酬金额：从低到高</option>
                            <option value="reward_desc">报酬金额：从高到低</option>
                            <option value="credit_asc">信用分数：从低到高</option>
                            <option value="credit_desc">信用分数：从高到低</option>
                        </select>
                    </div>
                    <button type="button" class="btn" id="searchBtn">搜索</button>
                </div>

                <p class="note">支持按互助类型、互助分类和关键词组合筛选；不选择分类时默认显示全部分类。</p>
            </div>

            <div id="emptyState" class="card empty-state" style="display: none;">
                <p>暂无符合条件的任务，请尝试调整筛选条件。</p>
            </div>

            <div class="task-list" id="taskList">
                <!-- 任务列表由 JS 动态渲染 -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
