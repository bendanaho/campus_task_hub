<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消息中心</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助任务平台</div>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="task-hall.html">任务大厅</a>
                <a href="publish-task.html">发布任务</a>
                <a href="message-center.html" class="active">消息中心</a>
                <span id="navAuthArea"></span>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="section-title">消息中心</h1>

            <div class="message-list">
                <div class="message-item">
                    <h3>聊天对象：李四</h3>
                    <p class="meta">对应任务：帮忙取快递</p>
                    <p>最近消息：好的，我 10 分钟后到宿舍楼下。</p>
                    <p class="meta">时间：2026-04-07 14:30</p>
                    <div class="actions">
                        <a href="chat-detail.html" class="btn">进入聊天</a>
                    </div>
                </div>

                <div class="message-item">
                    <h3>聊天对象：王同学</h3>
                    <p class="meta">对应任务：代拿外卖</p>
                    <p>最近消息：辛苦了，到了给我发消息就行。</p>
                    <p class="meta">时间：2026-04-07 12:40</p>
                    <div class="actions">
                        <a href="chat-detail.html" class="btn">进入聊天</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助任务平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
