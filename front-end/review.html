<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务评价</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>
            <nav class="nav-links">

            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="card form-container">
                <h1 class="form-title">任务评价</h1>

                <form>
                    <div class="form-group">
                        <label for="taskName">任务名称</label>
                        <input type="text" id="taskName" class="form-control" value="帮忙取快递" />
                    </div>

                    <div class="form-group">
                        <label for="reviewTarget">被评价对象</label>
                        <input type="text" id="reviewTarget" class="form-control" value="李四" />
                    </div>

                    <div class="form-group">
                        <label>评分</label>
                        <div class="rating-box">
                            <button type="button" class="rating-star" aria-label="1 星">★</button>
                            <button type="button" class="rating-star" aria-label="2 星">★</button>
                            <button type="button" class="rating-star" aria-label="3 星">★</button>
                            <button type="button" class="rating-star" aria-label="4 星">★</button>
                            <button type="button" class="rating-star" aria-label="5 星">★</button>
                            <span class="rating-num" id="ratingNum">5 星</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reviewContent">评价内容</label>
                        <textarea id="reviewContent" class="form-control" placeholder="请输入评价内容"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn">提交评价</button>
                        <a href="order-center.html" class="btn btn-secondary">返回我的订单</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
