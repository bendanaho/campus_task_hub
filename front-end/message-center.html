<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消息中心</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>
            <nav class="nav-links">

            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="section-title">消息中心</h1>

            <div id="msgOverview" class="order-overview"></div>
            <div id="msgTabs" class="order-tabs"></div>

            <div class="filter-bar" id="msgFilterBar" style="display:none;">
                <select id="msgStatusFilter" class="form-control">
                    <option value="all">全部状态</option>
                    <option value="action">待我操作</option>
                    <option value="progress">进行中</option>
                    <option value="review">待我评价</option>
                    <option value="done">已完成</option>
                    <option value="closed">已下架/已结束</option>
                </select>
                <select id="msgRoleFilter" class="form-control">
                    <option value="all">全部角色</option>
                    <option value="payer">我付款</option>
                    <option value="earner">我收款</option>
                </select>
                <input type="text" id="msgKeyword" class="form-control" placeholder="搜索任务标题 / 对方用户名" />
                <button type="button" class="btn" id="msgSearchBtn">搜索</button>
            </div>

            <div class="message-list" id="messageList">
                <!-- 消息列表由 JS 动态渲染 -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
