<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的订单 - 校园互助平台</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>
            <nav class="nav-links"></nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="section-title">我的订单</h1>

            <div class="filter-bar">
                <select id="orderFilter" class="form-control">
                    <option value="all">全部</option>
                    <option value="payer">我付款的</option>
                    <option value="earner">我收款的</option>
                </select>
                <select id="orderStatus" class="form-control">
                    <option value="all">全部状态</option>
                    <option value="pending">待接受</option>
                    <option value="in_progress">进行中</option>
                    <option value="completed">已完成</option>
                    <option value="cancelled">已取消</option>
                    <option value="disputed">争议中</option>
                    <option value="closed">已结案</option>
                </select>
                <input
                    type="text"
                    id="orderKeyword"
                    class="form-control"
                    placeholder="搜索标题 / 对方用户名 / 订单号"
                />
                <button type="button" class="btn" id="orderSearchBtn">搜索</button>
            </div>

            <div class="record-list"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
