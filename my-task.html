<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的任务</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助任务平台</div>
            <nav class="nav-links">

            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="section-title">我的任务</h1>

            <div class="tabs">
                <div class="tab">我发布的任务</div>
                <div class="tab">我接取的任务</div>
            </div>

            <div class="record-list">
                <div class="record-item">
                    <h3>帮忙取快递</h3>
                    <p class="meta">身份：发布者 ｜ 状态：进行中 ｜ 发布时间：2026-04-07 10:30</p>
                    <p>接单人：李四</p>
                    <div class="actions">
                        <a href="task-detail.html" class="btn btn-secondary">查看详情</a>
                        <a href="chat-detail.html" class="btn btn-secondary">联系对方</a>
                        <button type="button" class="btn" onclick="showDemoMessage('任务已完成（演示）')">完成任务</button>
                        <a href="review.html" class="btn btn-secondary">去评价</a>
                    </div>
                </div>

                <div class="record-item">
                    <h3>代拿外卖</h3>
                    <p class="meta">身份：接单者 ｜ 状态：进行中 ｜ 发布时间：2026-04-07 11:10</p>
                    <p>发布者：王同学</p>
                    <div class="actions">
                        <a href="task-detail.html" class="btn btn-secondary">查看详情</a>
                        <a href="chat-detail.html" class="btn btn-secondary">联系对方</a>
                        <button type="button" class="btn btn-danger" onclick="showDemoMessage('任务已取消（演示）')">取消任务</button>
                        <a href="review.html" class="btn btn-secondary">去评价</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助任务平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
