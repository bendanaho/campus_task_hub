# 生产环境 / MySQL 配置
# 使用方式: mvn spring-boot:run -Dspring-boot.run.profiles=prod
#
# 注意：部署前务必修改以下内容：
#   1. password — 替换为实际数据库密码
#   2. useSSL — 生产环境必须启用 TLS
#   3. 建议使用环境变量注入敏感配置

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_task_hub?useUnicode=true&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_password_here
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
