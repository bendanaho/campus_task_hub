<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户注册</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>
            <nav class="nav-links">

            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="card form-container">
                <h1 class="form-title">用户注册</h1>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerUsername">用户名<span class="required-star">*</span></label>
                        <input
                            type="text"
                            id="registerUsername"
                            class="form-control"
                            placeholder="请输入用户名"
                        />
                    </div>

                    <div class="form-group">
                        <label for="registerPhone">手机号<span class="required-star">*</span></label>
                        <input
                            type="text"
                            id="registerPhone"
                            class="form-control"
                            placeholder="请输入手机号"
                        />
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">邮箱<span class="required-star">*</span></label>
                        <input
                            type="email"
                            id="registerEmail"
                            class="form-control"
                            placeholder="请输入邮箱"
                        />
                        <p class="note" style="margin-top:6px;">忘记密码时用它接收验证码，请填写你能收到信的邮箱。</p>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">密码<span class="required-star">*</span></label>
                        <input
                            type="password"
                            id="registerPassword"
                            class="form-control"
                            placeholder="请输入密码"
                        />
                    </div>

                    <div class="form-group">
                        <label for="registerConfirmPassword">确认密码<span class="required-star">*</span></label>
                        <input
                            type="password"
                            id="registerConfirmPassword"
                            class="form-control"
                            placeholder="请再次输入密码"
                        />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn">注册</button>
                        <a href="login.html" class="btn btn-secondary">返回登录</a>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
