<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>找回密码</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>
            <nav class="nav-links">

            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="card form-container">
                <h1 class="form-title">找回密码</h1>

                <!-- 第一步：核对账号与绑定邮箱，通过后把验证码发到该邮箱 -->
                <section id="resetStep1">
                    <p class="note" style="margin-top:0;">
                        输入你的账号和注册时绑定的邮箱，我们会把验证码发到这个邮箱。
                    </p>

                    <div class="form-group">
                        <label for="resetAccount">用户名 / 手机号 / 邮箱</label>
                        <input type="text" id="resetAccount" class="form-control"
                               placeholder="请输入用户名/手机号/邮箱" autocomplete="username" />
                    </div>

                    <div class="form-group">
                        <label for="resetEmail">绑定的邮箱</label>
                        <input type="email" id="resetEmail" class="form-control"
                               placeholder="请输入该账号绑定的邮箱" autocomplete="email" />
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn" id="sendCodeBtn">发送验证码</button>
                        <a href="login.html" class="btn btn-secondary">返回登录</a>
                    </div>

                    <p class="note">
                        没有绑定邮箱？该账号无法自助找回，请联系管理员核实身份后重置密码。
                    </p>
                </section>

                <!-- 第二步：填验证码和新密码。整段默认隐藏，发码成功后才显示 -->
                <section id="resetStep2" style="display:none;">
                    <p class="note" style="margin-top:0;">
                        验证码已发往 <strong id="resetEmailEcho"></strong>，5 分钟内有效。<br />
                        没收到的话记得看一眼垃圾邮件。
                    </p>

                    <form id="resetForm">
                        <div class="form-group">
                            <label for="resetCode">邮箱验证码</label>
                            <input type="text" id="resetCode" class="form-control"
                                   placeholder="请输入 6 位验证码" inputmode="numeric" maxlength="6"
                                   autocomplete="one-time-code" />
                        </div>

                        <div class="form-group">
                            <label for="resetNewPassword">新密码</label>
                            <input type="password" id="resetNewPassword" class="form-control"
                                   placeholder="请输入新密码（至少 6 位）" autocomplete="new-password" />
                        </div>

                        <div class="form-group">
                            <label for="resetConfirmPassword">确认新密码</label>
                            <input type="password" id="resetConfirmPassword" class="form-control"
                                   placeholder="请再次输入新密码" autocomplete="new-password" />
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn">重置密码</button>
                            <button type="button" class="btn btn-secondary" id="resendCodeBtn">重新发送</button>
                            <button type="button" class="btn btn-secondary" id="backToStep1Btn">上一步</button>
                        </div>
                    </form>

                    <p class="note">
                        重置成功后，该账号在其他设备上的登录状态会全部失效，需要用新密码重新登录。
                    </p>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
