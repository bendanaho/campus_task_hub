<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户登录</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助任务平台</div>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="task-hall.html">任务大厅</a>
                <span id="navAuthArea"></span>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="card form-container">
                <h1 class="form-title">用户登录</h1>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginAccount">用户名 / 手机号</label>
                        <input
                            type="text"
                            id="loginAccount"
                            class="form-control"
                            placeholder="请输入用户名或手机号"
                        />
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input
                            type="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="请输入密码"
                        />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn">登录</button>
                        <a href="register.html" class="btn btn-secondary">去注册</a>
                    </div>
                </form>

                <p class="note">说明：登录成功后会将当前用户状态保存在本地浏览器中。</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助任务平台 © 2026</p>
        </div>
    </footer>
</body>
</html>
