<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 互助校园</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="../js/utils.js" defer></script>
  <script src="../js/mock-data.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coral: '#e8553a',
            'coral-deep': '#d4442c',
            cream: '#fff9f2',
            ink: '#1e3a5f',
            'ink-soft': '#3d5a80',
            sun: '#f5b942',
          },
          fontFamily: {
            display: ['Nunito', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .font-display { font-family: 'Nunito', system-ui, sans-serif; }
    .dot-pattern {
      background-image: radial-gradient(circle, rgba(255,255,255,0.35) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }
    .float-a { animation: floaty 6s ease-in-out infinite; }
    .float-b { animation: floaty 7s ease-in-out infinite 1.2s; }
    .float-c { animation: floaty 8s ease-in-out infinite 0.6s; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    input:focus { outline: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-cream min-h-screen text-ink">
  <main class="min-h-screen lg:grid lg:grid-cols-[1.05fr_1fr]">

    <!-- ===== 左侧 暖橙品牌区 ===== -->
    <section class="relative overflow-hidden bg-gradient-to-br from-coral via-coral to-coral-deep text-white px-8 py-10 lg:p-14 flex flex-col justify-between min-h-[44vh] lg:min-h-screen">
      <!-- 圆点纹理 -->
      <div class="absolute inset-0 dot-pattern opacity-60"></div>
      <!-- 装饰圆 -->
      <div class="absolute -top-20 -right-16 w-72 h-72 rounded-full bg-white/10"></div>
      <div class="absolute bottom-24 -left-12 w-44 h-44 rounded-full bg-sun/20"></div>
      <div class="absolute top-1/3 right-10 w-3 h-3 rounded-full bg-sun hidden lg:block"></div>

      <!-- Logo -->
      <div class="relative z-10 flex items-center gap-2.5">
        <div class="w-11 h-11 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-xl">🤲</div>
        <span class="font-display font-extrabold text-xl tracking-tight">互助校园</span>
      </div>

      <!-- Slogan -->
      <div class="relative z-10 max-w-md my-10 lg:my-0">
        <div class="flex flex-wrap gap-2 mb-6">
          <span class="px-3 py-1 rounded-full bg-white/20 text-sm font-bold">🏃 跑腿代取</span>
          <span class="px-3 py-1 rounded-full bg-white/20 text-sm font-bold">📚 学习辅导</span>
          <span class="px-3 py-1 rounded-full bg-white/20 text-sm font-bold">🛍️ 二手交易</span>
        </div>
        <h1 class="font-display font-extrabold text-4xl lg:text-[3.4rem] leading-[1.1]">
          同学帮同学<br>校园更暖
        </h1>
        <!-- 手绘波浪下划线 -->
        <svg class="mt-4" width="200" height="16" viewBox="0 0 200 16" fill="none" aria-hidden="true">
          <path d="M4 9 Q 26 2, 50 8 T 100 9 T 150 8 T 196 9" stroke="#f5b942" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <p class="mt-5 text-white/85 text-base lg:text-lg leading-relaxed">
          一个让大学生互相搭把手的小角落。发个悬赏、接个服务、凑支队伍——校园里的事，同学最懂同学。
        </p>
      </div>

      <!-- 漂浮迷你卡片 -->
      <div class="relative z-10 hidden lg:flex gap-3">
        <div class="float-a bg-white/15 backdrop-blur rounded-2xl px-4 py-3 border border-white/20">
          <div class="text-2xl">📦</div>
          <div class="text-xs mt-1 text-white/80 font-bold">代取快递</div>
        </div>
        <div class="float-b bg-white/15 backdrop-blur rounded-2xl px-4 py-3 border border-white/20">
          <div class="text-2xl">🤝</div>
          <div class="text-xs mt-1 text-white/80 font-bold">组队互助</div>
        </div>
        <div class="float-c bg-white/15 backdrop-blur rounded-2xl px-4 py-3 border border-white/20">
          <div class="text-2xl">💻</div>
          <div class="text-xs mt-1 text-white/80 font-bold">技术服务</div>
        </div>
      </div>

      <!-- 底部手绘波浪 -->
      <svg class="absolute bottom-0 left-0 w-full" viewBox="0 0 1440 120" preserveAspectRatio="none" fill="none" aria-hidden="true">
        <path d="M0 70 Q 180 20, 360 65 T 720 70 T 1080 60 T 1440 70 L1440 120 L0 120 Z" fill="#fff9f2"/>
      </svg>
    </section>

    <!-- ===== 右侧 表单区 ===== -->
    <section class="flex items-center justify-center px-6 py-12 lg:p-12">
      <div class="w-full max-w-md">

        <!-- 移动端 Logo -->
        <div class="lg:hidden flex items-center gap-2.5 mb-10 justify-center">
          <div class="w-11 h-11 rounded-2xl bg-coral flex items-center justify-center text-xl">🤲</div>
          <span class="font-display font-extrabold text-xl text-ink">互助校园</span>
        </div>

        <div class="mb-8">
          <h2 class="font-display font-extrabold text-3xl text-ink">欢迎回来 👋</h2>
          <p class="text-ink-soft mt-2">登录后继续帮同学、被同学帮。</p>
        </div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label for="loginAccount" class="block text-sm font-bold text-ink mb-2">账号</label>
            <input id="loginAccount" type="text" autocomplete="username" placeholder="学号 / 用户名"
              class="w-full px-5 py-3.5 rounded-2xl border-2 border-ink/10 bg-white focus:border-coral focus:ring-4 focus:ring-coral/10 transition placeholder:text-ink/30 text-ink">
          </div>
          <div>
            <label for="loginPassword" class="block text-sm font-bold text-ink mb-2">密码</label>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码"
              class="w-full px-5 py-3.5 rounded-2xl border-2 border-ink/10 bg-white focus:border-coral focus:ring-4 focus:ring-coral/10 transition placeholder:text-ink/30 text-ink">
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-ink-soft cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded accent-coral">
              记住我
            </label>
            <a href="#" class="text-coral font-bold hover:underline">忘记密码？</a>
          </div>
          <button type="submit"
            class="w-full py-3.5 rounded-full bg-coral hover:bg-coral-deep text-white font-display font-extrabold text-lg shadow-lg shadow-coral/30 transition active:scale-[0.98]">
            登录
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-ink-soft">
          还没有账号？<a href="../register.html" class="text-coral font-bold hover:underline">去注册</a>
        </div>

        <!-- 演示账号提示 -->
        <div class="mt-8 p-4 rounded-2xl bg-sun/15 border border-sun/40 flex items-center gap-3">
          <span class="text-xl">💡</span>
          <p class="text-xs text-ink-soft leading-relaxed">
            演示账号：<span class="font-bold text-ink">admin</span> / <span class="font-bold text-ink">123456</span>
          </p>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
