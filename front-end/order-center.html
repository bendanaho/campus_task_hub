<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>我的订单 - 校园互助平台</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/utils.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">校园互助平台</div>

    <main class="page">

            </div>

            <div class="record-list"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>校园互助平台 © 2026</p>
        </div>
